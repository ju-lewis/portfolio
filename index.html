<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>ju.lewis</title>

		<!-- Font Imports -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

		<!-- Favicon Stuff -->
		<link rel="apple-touch-icon" sizes="180x180" href="imgs/pfp-apple-touch.jpg">
		<link rel="icon" type="image/png" sizes="32x32" href="imgs/pfp-32x32.jpg">
		<link rel="icon" type="image/png" sizes="16x16" href="imgs/pfp-16x16.jpg">
		<link rel="manifest" href="/site.webmanifest">

		<style>
			:root { --fg: #e6e6e6; --dim: #7a7a7a; --bg: #000; --accent: #7aa6da; }
			* { box-sizing: border-box; }
			html, body { margin: 0; height: 100%; overflow: hidden; }
			body {
				font: 17px/1.5 "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
				color: var(--fg);
				cursor: text;
			}

			/* monitor bezel */
			.monitor {
				position: relative; height: 100%;
				padding: 32px 32px 64px;
				background: linear-gradient(160deg, #ddd5c0, #b3ab95);
				box-shadow: inset 0 2px 2px rgba(255,255,255,.7), inset 0 -6px 12px rgba(0,0,0,.25);
			}
			.badge {
				position: absolute; left: 40px; bottom: 20px;
				font-size: 12px; font-weight: 700; letter-spacing: .3em; color: #6e6754;
				text-shadow: 0 1px 0 rgba(255,255,255,.5);
			}
			.led {
				position: absolute; right: 44px; bottom: 26px;
				width: 10px; height: 10px; border-radius: 50%;
				background: #5f5; box-shadow: 0 0 8px #5f5;
			}

			/* the glass: rounded tube, scanlines, vignette, rolling band */
			.glass {
				position: relative; height: 100%; overflow: hidden;
				border-radius: 22px / 26px;
				background: var(--bg);
				box-shadow: 0 0 0 4px #3b382f, 0 0 0 6px #8c8572;
			}
			.glass::before, .glass::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2; }
			.glass::before {
				background:
					radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.65) 100%),
					repeating-linear-gradient(to bottom, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
			}
			.glass::after {
				height: 18%;
				background: linear-gradient(to bottom, transparent, rgba(255,255,255,.05), transparent);
				animation: roll 7s linear infinite;
			}
			@keyframes roll { from { transform: translateY(-100%); } to { transform: translateY(600%); } }
			#screen {
				height: 100%; overflow-y: auto; padding: 20px 24px;
				text-shadow: 0 0 4px rgba(230,230,230,.35);
				scrollbar-width: none;
			}
			#screen::-webkit-scrollbar { display: none; }

			@media (max-width: 600px) {
				body { font-size: 14px; }
				.monitor { padding: 14px 14px 40px; }
				.badge { left: 20px; bottom: 12px; }
				.led { right: 22px; bottom: 16px; }
				#screen { padding: 12px; }
			}
			::selection { background: var(--fg); color: var(--bg); }
			a { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
			a:hover { background: var(--fg); color: var(--bg); }
			b { font-weight: 700; color: #fff; }
			.dim { color: var(--dim); }
			.line { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 1.5em; }

			/* fastfetch */
			.fastfetch { display: flex; flex-wrap: wrap; gap: 3ch; margin: .5em 0 1em; align-items: flex-start; }
			.fastfetch img {
				width: 300px; max-width: 100%;
				border: 1px solid var(--fg);
				animation: scan .35s steps(8) both;
			}
			@keyframes scan { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0); } }
			.fastfetch .k { color: var(--accent); font-weight: 700; }
			.blocks span { display: inline-block; width: 3ch; height: 1.2em; }

			/* ls */
			.ls span { margin-right: 3ch; }

			/* help */
			.help { margin-bottom: 1em; }
			.help .cmd { display: inline-block; width: 14ch; }

			/* live prompt */
			#live { position: relative; }
			#cur { animation: blink 1s steps(1) infinite; outline: 1px solid var(--fg); outline-offset: -1px; }
			body:focus-within #cur { background: var(--fg); color: var(--bg); }
			@keyframes blink { 50% { background: transparent; color: var(--fg); outline-color: transparent; } }
			#in {
				position: absolute; left: 0; top: 0; width: 1px; height: 1px;
				opacity: 0; border: 0; padding: 0; font-size: 16px; /* 16px stops iOS zoom-on-focus */
			}

			/* floating windows: late-90s GUI style. Sits above the scanlines so it stays crisp. */
			#desk { position: absolute; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
			.win {
				--bevel-out: inset -1px -1px #0a0a0a, inset 1px 1px #dfdfdf, inset -2px -2px #808080, inset 2px 2px #fff;
				--bevel-in: inset 1px 1px #808080, inset -1px -1px #fff, inset 2px 2px #0a0a0a, inset -2px -2px #dfdfdf;
				position: absolute; pointer-events: auto; cursor: default;
				width: min(440px, 90%); padding: 3px;
				background: #c0c0c0; color: #000;
				box-shadow: var(--bevel-out), 2px 2px 10px rgba(0,0,0,.5);
				font: 13px/1.4 Tahoma, Verdana, "Segoe UI", Arial, sans-serif;
			}
			.win .bar {
				display: flex; align-items: center; justify-content: space-between;
				height: 22px; padding: 0 2px 0 6px;
				background: linear-gradient(90deg, #000080, #1084d0); color: #fff;
				font-weight: 700; cursor: grab; touch-action: none; user-select: none;
			}
			.win.inactive .bar { background: linear-gradient(90deg, #808080, #b5b5b5); color: #d4d0c8; }
			.win .bar:active { cursor: grabbing; }
			.win button, .win .btn {
				background: #c0c0c0; color: #000; border: 0; box-shadow: var(--bevel-out);
				font: inherit; cursor: pointer;
			}
			.win button:active, .win .btn:active { box-shadow: var(--bevel-in); }
			.win .close { width: 18px; height: 16px; padding: 0 0 2px; font: 700 14px/1 Arial, sans-serif; }
			.win .body { padding: 10px 8px 6px; }
			.win .panel { background: #fff; box-shadow: var(--bevel-in); padding: 12px 14px; margin-bottom: 10px; }
			.win .panel p { margin: 0 0 12px; }
			.win dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; }
			.win dt { font-weight: 700; }
			.win dd { margin: 0; }
			.win a { color: #00e; }
			.win a:hover { background: none; color: #00e; }
			.win .actions { margin: 0; text-align: right; }
			.win .btn { display: inline-block; min-width: 80px; padding: 4px 14px; text-align: center; text-decoration: none; }

			@media (prefers-reduced-motion: reduce) {
				.fastfetch img, #cur, .glass::after { animation: none; }
			}
		</style>
	</head>

	<body>
		<div class="monitor">
			<div class="glass">
				<div id="screen">
					<main id="out" aria-live="polite"></main>
					<div id="live" class="line" hidden><span id="ps"></span> <span id="before"></span><span id="cur"> </span><span id="after"></span><input id="in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Terminal input"></div>
				</div>
				<div id="desk"></div>
			</div>
			<span class="badge" aria-hidden="true">JL&middot;1998</span>
			<span class="led" aria-hidden="true"></span>
		</div>

		<script>
			// Project windows. `desc` and `details` values are HTML; add/remove detail rows freely.
			const PROJECTS = {
				startbase: {
					title: 'Startbase', url: 'https://startbase.site',
					desc: 'A CRM and booking platform for small businesses.',
					details: { Type: 'Web app', Stack: 'TODO', Status: 'TODO' },
				},
				lai: {
					title: 'Lai', url: 'https://apps.apple.com/au/app/lai/id6751134068',
					desc: 'A mobile app for saving social media posts to a map, so you can browse saved content by place.',
					details: { Type: 'iOS app', Stack: 'TODO', Status: 'On the App Store' },
				},
				microqwen: {
					title: 'MicroQwen', url: 'https://github.com/ju-lewis/MicroQwen',
					desc: 'A simple inference engine for Qwen2.5 0.5B, written from scratch in C.',
					details: { Type: 'Library / CLI', Stack: 'C', Status: 'TODO' },
				},
				helium: {
					title: 'Helium', url: 'https://github.com/ju-lewis/helium',
					desc: 'A small and simple HTTP server library.',
					details: { Type: 'Library', Stack: 'Rust', Status: 'TODO' },
				},
				postrax: {
					title: 'PosTrax', url: 'https://postrax.com.au/',
					desc: 'Automatic scoring for yacht racing using a custom RTK GNSS system.',
					details: { Type: 'Hardware + software', Stack: 'TODO', Status: 'TODO' },
				},
				playground: {
					title: 'Playground', url: 'experiments.html',
					desc: "A collection of small web-native projects I've worked on.",
					details: { Type: 'Web experiments', Stack: 'HTML, CSS, JS' },
				},
			};

			const FS = {
				projects: Object.fromEntries(Object.entries(PROJECTS).map(([k, p]) => [k, p.url])),
				contact: {
					email: 'mailto:julianlewis2023@gmail.com',
					github: 'https://github.com/ju-lewis',
				},
			};

			const out = document.getElementById('out');
			const live = document.getElementById('live');
			const input = document.getElementById('in');
			const $ = id => document.getElementById(id);
			const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
			const sleep = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));
			const esc = s => s.replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
			const screen = document.getElementById('screen');
			const scroll = () => { screen.scrollTop = screen.scrollHeight; };

			let cwd = [];
			const history = [];
			let hIdx = 0;

			const ps = () => `<b>julian@ju.lewis</b>:<b>~${esc(cwd.map(p => '/' + p).join(''))}</b>$`;

			function print(html, cls = 'line') {
				const el = document.createElement('div');
				el.className = cls;
				el.innerHTML = html;
				out.append(el);
				scroll();
				return el;
			}

			// Resolve a path against cwd. Returns [parts, node]; node is undefined if missing.
			function resolve(path) {
				const parts = /^[~/]/.test(path) ? [] : [...cwd];
				for (const p of path.replace(/^~/, '').split('/')) {
					if (!p || p === '.') continue;
					if (p === '..') parts.pop(); else parts.push(p);
				}
				let node = FS;
				for (const p of parts) {
					if (typeof node !== 'object' || !Object.hasOwn(node, p)) return [parts, undefined];
					node = node[p];
				}
				return [parts, node];
			}

			const entry = (name, node) => typeof node === 'object'
				? `<span><b>${esc(name)}/</b></span>`
				: Object.hasOwn(PROJECTS, name)
					? `<span><a href="${node}" data-win="${esc(name)}">${esc(name)}</a></span>`
					: `<span><a href="${node}" target="_blank" rel="noopener">${esc(name)}</a></span>`;

			// Floating, draggable project windows.
			const desk = document.getElementById('desk');
			let topZ = 0, opened = 0;

			function openWin(name) {
				let w = document.getElementById('win-' + name);
				if (!w) {
					const p = PROJECTS[name];
					w = document.createElement('section');
					w.className = 'win';
					w.id = 'win-' + name;
					w.setAttribute('role', 'dialog');
					w.setAttribute('aria-label', p.title);
					w.innerHTML =
						`<div class="bar"><span class="title">${esc(p.title)}</span><button class="close" aria-label="Close ${esc(p.title)}">&times;</button></div>` +
						`<div class="body"><div class="panel"><p>${p.desc}</p><dl>` +
						Object.entries(p.details).map(([k, v]) => `<dt>${k}:</dt><dd>${v}</dd>`).join('') +
						`</dl></div><p class="actions"><a class="btn" href="${p.url}" target="_blank" rel="noopener">Open</a></p></div>`;
					w.querySelector('.close').onclick = () => w.remove();
					w.addEventListener('pointerdown', () => focusWin(w));
					draggable(w);
					desk.append(w);
					const off = 40 + (opened++ % 6) * 28;
					place(w, desk.clientWidth / 2 - w.offsetWidth / 2 + off - 110, off);
				}
				focusWin(w);
			}

			function focusWin(w) {
				w.style.zIndex = ++topZ;
				for (const x of desk.children) x.classList.toggle('inactive', x !== w);
			}

			// Keep at least the title bar grabbable on screen.
			function place(w, x, y) {
				const minVis = 60;
				w.style.left = Math.min(Math.max(x, minVis - w.offsetWidth), desk.clientWidth - minVis) + 'px';
				w.style.top = Math.min(Math.max(y, 0), desk.clientHeight - 30) + 'px';
			}

			function draggable(w) {
				const bar = w.querySelector('.bar');
				bar.addEventListener('pointerdown', e => {
					if (e.target.closest('button')) return;
					e.preventDefault();
					bar.setPointerCapture(e.pointerId);
					const dx = e.clientX - w.offsetLeft, dy = e.clientY - w.offsetTop;
					const move = e => place(w, e.clientX - dx, e.clientY - dy);
					const stop = () => {
						bar.removeEventListener('pointermove', move);
						bar.removeEventListener('pointerup', stop);
						bar.removeEventListener('pointercancel', stop);
					};
					bar.addEventListener('pointermove', move);
					bar.addEventListener('pointerup', stop);
					bar.addEventListener('pointercancel', stop);
				});
			}

			const commands = {
				help() {
					print(
						`ju.lewis: the personal site of Julian Lewis. Look around with the commands below.\n\n` +
						`<span class="cmd">help</span><span class="dim">show this message</span>\n` +
						`<span class="cmd">ls [dir]</span><span class="dim">list directory contents (click files to open)</span>\n` +
						`<span class="cmd">cd [dir]</span><span class="dim">change directory</span>\n` +
						`<span class="cmd">fastfetch</span><span class="dim">show system (well, my) info</span>\n` +
						`<span class="cmd">clear</span><span class="dim">clear the screen (or Ctrl+L)</span>\n\n` +
						`<span class="dim">Tab completes commands and paths. Up/Down cycles history.</span>`,
						'line help'
					);
				},
				ls(path = '.') {
					const [, node] = resolve(path);
					if (node === undefined) return print(`ls: cannot access '${esc(path)}': No such file or directory`);
					if (typeof node !== 'object') return print(entry(path, node), 'line ls');
					print(Object.entries(node).map(([k, v]) => entry(k, v)).join(''), 'line ls');
				},
				cd(path = '~') {
					const [parts, node] = resolve(path);
					if (node === undefined) return print(`cd: no such file or directory: ${esc(path)}`);
					if (typeof node !== 'object') return print(`cd: not a directory: ${esc(path)}`);
					cwd = parts;
				},
				clear() { out.innerHTML = ''; },
				async fastfetch() {
					const info = [
						`<span class="k">julian</span>@<span class="k">ju.lewis</span>`,
						'─'.repeat(15),
						['Name', 'Julian Lewis'],
						['Role', 'Founder, CTO @ Idiom'],
						['Location', 'Melbourne, AU'],
						['Education', 'Computer Science graduate'],
						['Also', 'Motorsports electrical engineer'],
						['Projects', 'Idiom, Lai, PosTrax, MicroQwen'],
						['GitHub', '<a href="https://github.com/ju-lewis" target="_blank" rel="noopener">ju-lewis</a>'],
						['Email', '<a href="mailto:julianlewis2023@gmail.com">julianlewis2023@gmail.com</a>'],
						['Shell', 'jlsh 1.0'],
						'',
						// Tomorrow Night ANSI palette: normal row, then bright row.
						...[['#1d1f21', '#cc6666', '#b5bd68', '#f0c674', '#81a2be', '#b294bb', '#8abeb7', '#c5c8c6'],
							['#666666', '#d54e53', '#b9ca4a', '#e7c547', '#7aa6da', '#c397d8', '#70c0b1', '#eaeaea']]
							.map(row => `<span class="blocks">${row.map(c => `<span style="background:${c}"></span>`).join('')}</span>`),
					];
					const box = print('<img src="imgs/new-car.jpg" alt="Julian Lewis"><div class="info"></div>', 'fastfetch');
					const col = box.querySelector('.info');
					for (const l of info) {
						await sleep(30);
						const d = document.createElement('div');
						d.className = 'line';
						d.innerHTML = Array.isArray(l) ? `<span class="k">${l[0]}</span>: ${l[1]}` : l;
						col.append(d);
						scroll();
					}
				},
			};

			async function run(line) {
				const [cmd, ...args] = line.trim().split(/\s+/);
				if (!cmd) return;
				if (!Object.hasOwn(commands, cmd)) return print(`${esc(cmd)}: command not found. Try 'help'.`);
				await commands[cmd](...args);
			}

			// Type a command into a fake prompt, then run it (intro only).
			async function autoType(cmd) {
				const el = print(`${ps()} <span></span>`);
				const span = el.querySelector('span:last-child');
				await sleep(400);
				for (const c of cmd) { span.textContent += c; await sleep(70); }
				await sleep(250);
				await run(cmd);
			}

			// Bash-style tab completion: commands for the first word, FS paths after.
			function complete() {
				const v = input.value;
				const i = v.lastIndexOf(' ') + 1;
				const word = v.slice(i);
				let base = '', opts;
				if (!v.slice(0, i).trim()) {
					opts = Object.keys(commands).filter(c => c.startsWith(word)).map(c => c + ' ');
				} else {
					base = word.slice(0, word.lastIndexOf('/') + 1);
					const [, node] = resolve(base || '.');
					if (typeof node !== 'object') return;
					opts = Object.entries(node)
						.filter(([k]) => k.startsWith(word.slice(base.length)))
						.map(([k, n]) => base + k + (typeof n === 'object' ? '/' : ' '));
				}
				if (!opts.length) return;
				let common = opts[0];
				for (const o of opts) while (!o.startsWith(common)) common = common.slice(0, -1);
				if (common.length > word.length) {
					input.value = v.slice(0, i) + common;
					return render();
				}
				// Ambiguous: list the options like bash does, keep the line.
				print(`${ps()} ${esc(v)}`);
				print(opts.map(o => `<span>${esc(o.slice(base.length).trim())}</span>`).join(''), 'line ls');
				render();
			}

			function render() {
				const v = input.value, i = input.selectionStart ?? v.length;
				$('ps').innerHTML = ps();
				$('before').textContent = v.slice(0, i);
				$('cur').textContent = v[i] || ' ';
				$('after').textContent = v.slice(i + 1);
				scroll();
			}

			input.addEventListener('input', render);
			input.addEventListener('keyup', render);
			input.addEventListener('keydown', async e => {
				if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
					e.preventDefault();
					hIdx = Math.max(0, Math.min(history.length, hIdx + (e.key === 'ArrowUp' ? -1 : 1)));
					input.value = history[hIdx] ?? '';
					return render();
				}
				if (e.key === 'Tab') { e.preventDefault(); return complete(); }
				if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); return commands.clear(); }
				if (e.key !== 'Enter') return;
				const line = input.value;
				input.value = '';
				print(`${ps()} ${esc(line)}`);
				if (line.trim()) hIdx = history.push(line);
				live.hidden = true;
				await run(line);
				live.hidden = false;
				render();
				input.focus();
			});

			// Click anywhere to focus the prompt, unless selecting text or clicking a link.
			document.addEventListener('click', e => {
				const win = e.target.closest('[data-win]');
				if (win) { e.preventDefault(); return openWin(win.dataset.win); }
				if (!live.hidden && !e.target.closest('a, .win') && !getSelection().toString()) input.focus();
			});

			(async () => {
				await autoType('fastfetch');
				await autoType('help');
                await autoType('ls');
				live.hidden = false;
				render();
				input.focus();
			})();
		</script>
	</body>
</html>
