<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>ju.lewis</title>

		<!-- Font Imports -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

		<!-- Favicon Stuff -->
		<link rel="apple-touch-icon" sizes="180x180" href="imgs/pfp-apple-touch.jpg">
		<link rel="icon" type="image/png" sizes="32x32" href="imgs/pfp-32x32.jpg">
		<link rel="icon" type="image/png" sizes="16x16" href="imgs/pfp-16x16.jpg">
		<link rel="manifest" href="/site.webmanifest">

		<style>
			:root { --fg: #e6e6e6; --dim: #7a7a7a; --bg: #000; --accent: #7aa6da; }
			* { box-sizing: border-box; }
			html, body { margin: 0; height: 100%; overflow: hidden; }
			body {
				font: 17px/1.5 "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
				color: var(--fg);
				background: radial-gradient(ellipse at top, #2a2a2a, #0b0b0b);
				padding: 2.5vmin;
				cursor: text;
			}

			/* monitor bezel */
			.monitor {
				position: relative; height: 100%;
				padding: 32px 32px 64px;
				border-radius: 26px;
				background: linear-gradient(160deg, #ddd5c0, #b3ab95);
				box-shadow:
					inset 0 2px 2px rgba(255,255,255,.7),
					inset 0 -6px 12px rgba(0,0,0,.25),
					0 25px 60px rgba(0,0,0,.7);
			}
			.badge {
				position: absolute; left: 40px; bottom: 20px;
				font-size: 12px; font-weight: 700; letter-spacing: .3em; color: #6e6754;
				text-shadow: 0 1px 0 rgba(255,255,255,.5);
			}
			.led {
				position: absolute; right: 44px; bottom: 26px;
				width: 10px; height: 10px; border-radius: 50%;
				background: #5f5; box-shadow: 0 0 8px #5f5;
			}

			/* the glass: rounded tube, scanlines, vignette, rolling band */
			.glass {
				position: relative; height: 100%; overflow: hidden;
				border-radius: 22px / 26px;
				background: var(--bg);
				box-shadow: 0 0 0 4px #3b382f, 0 0 0 6px #8c8572;
			}
			.glass::before, .glass::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2; }
			.glass::before {
				background:
					radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.65) 100%),
					repeating-linear-gradient(to bottom, rgba(0,0,0,.35) 0 1px, transparent 1px 3px);
			}
			.glass::after {
				height: 18%;
				background: linear-gradient(to bottom, transparent, rgba(255,255,255,.05), transparent);
				animation: roll 7s linear infinite;
			}
			@keyframes roll { from { transform: translateY(-100%); } to { transform: translateY(600%); } }
			#screen {
				height: 100%; overflow-y: auto; padding: 20px 24px;
				text-shadow: 0 0 4px rgba(230,230,230,.35);
				scrollbar-width: none;
			}
			#screen::-webkit-scrollbar { display: none; }

			@media (max-width: 600px) {
				body { font-size: 14px; padding: 8px; }
				.monitor { padding: 14px 14px 40px; border-radius: 16px; }
				.badge { left: 20px; bottom: 12px; }
				.led { right: 22px; bottom: 16px; }
				#screen { padding: 12px; }
			}
			::selection { background: var(--fg); color: var(--bg); }
			a { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
			a:hover { background: var(--fg); color: var(--bg); }
			b { font-weight: 700; color: #fff; }
			.dim { color: var(--dim); }
			.line { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 1.5em; }

			/* fastfetch */
			.fastfetch { display: flex; flex-wrap: wrap; gap: 3ch; margin: .5em 0 1em; align-items: flex-start; }
			.fastfetch img {
				width: 300px; max-width: 100%;
				border: 1px solid var(--fg);
				animation: scan .35s steps(8) both;
			}
			@keyframes scan { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0); } }
			.fastfetch .k { color: var(--accent); font-weight: 700; }
			.blocks span { display: inline-block; width: 3ch; height: 1.2em; }

			/* ls */
			.ls span { margin-right: 3ch; }

			/* help */
			.help { margin-bottom: 1em; }
			.help .cmd { display: inline-block; width: 14ch; }

			/* live prompt */
			#live { position: relative; }
			#cur { animation: blink 1s steps(1) infinite; outline: 1px solid var(--fg); outline-offset: -1px; }
			body:focus-within #cur { background: var(--fg); color: var(--bg); }
			@keyframes blink { 50% { background: transparent; color: var(--fg); outline-color: transparent; } }
			#in {
				position: absolute; left: 0; top: 0; width: 1px; height: 1px;
				opacity: 0; border: 0; padding: 0; font-size: 16px; /* 16px stops iOS zoom-on-focus */
			}

			@media (prefers-reduced-motion: reduce) {
				.fastfetch img, #cur, .glass::after { animation: none; }
			}
		</style>
	</head>

	<body>
		<div class="monitor">
			<div class="glass">
				<div id="screen">
					<main id="out" aria-live="polite"></main>
					<div id="live" class="line" hidden><span id="ps"></span> <span id="before"></span><span id="cur"> </span><span id="after"></span><input id="in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Terminal input"></div>
				</div>
			</div>
			<span class="badge" aria-hidden="true">JL&middot;1984</span>
			<span class="led" aria-hidden="true"></span>
		</div>

		<script>
			const FS = {
				projects: {
					startbase: 'https://startbase.site',
					lai: 'https://apps.apple.com/au/app/lai/id6751134068',
					microqwen: 'https://github.com/ju-lewis/MicroQwen',
					helium: 'https://github.com/ju-lewis/helium',
					postrax: 'https://postrax.com.au/',
					playground: 'experiments.html',
				},
				contact: {
					email: 'mailto:julianlewis2023@gmail.com',
					github: 'https://github.com/ju-lewis',
				},
			};

			const out = document.getElementById('out');
			const live = document.getElementById('live');
			const input = document.getElementById('in');
			const $ = id => document.getElementById(id);
			const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
			const sleep = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));
			const esc = s => s.replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
			const screen = document.getElementById('screen');
			const scroll = () => { screen.scrollTop = screen.scrollHeight; };

			let cwd = [];
			const history = [];
			let hIdx = 0;

			const ps = () => `<b>julian@ju.lewis</b>:<b>~${esc(cwd.map(p => '/' + p).join(''))}</b>$`;

			function print(html, cls = 'line') {
				const el = document.createElement('div');
				el.className = cls;
				el.innerHTML = html;
				out.append(el);
				scroll();
				return el;
			}

			// Resolve a path against cwd. Returns [parts, node]; node is undefined if missing.
			function resolve(path) {
				const parts = /^[~/]/.test(path) ? [] : [...cwd];
				for (const p of path.replace(/^~/, '').split('/')) {
					if (!p || p === '.') continue;
					if (p === '..') parts.pop(); else parts.push(p);
				}
				let node = FS;
				for (const p of parts) {
					if (typeof node !== 'object' || !Object.hasOwn(node, p)) return [parts, undefined];
					node = node[p];
				}
				return [parts, node];
			}

			const entry = (name, node) => typeof node === 'object'
				? `<span><b>${esc(name)}/</b></span>`
				: `<span><a href="${node}" target="_blank" rel="noopener">${esc(name)}</a></span>`;

			const commands = {
				help() {
					print(
						`ju.lewis: the personal site of Julian Lewis. Look around with the commands below.\n\n` +
						`<span class="cmd">help</span><span class="dim">show this message</span>\n` +
						`<span class="cmd">ls [dir]</span><span class="dim">list directory contents (files are links)</span>\n` +
						`<span class="cmd">cd [dir]</span><span class="dim">change directory</span>\n` +
						`<span class="cmd">fastfetch</span><span class="dim">show system (well, my) info</span>\n` +
						`<span class="cmd">clear</span><span class="dim">clear the screen (or Ctrl+L)</span>\n\n` +
						`<span class="dim">Tab completes commands and paths. Up/Down cycles history.</span>`,
						'line help'
					);
				},
				ls(path = '.') {
					const [, node] = resolve(path);
					if (node === undefined) return print(`ls: cannot access '${esc(path)}': No such file or directory`);
					if (typeof node !== 'object') return print(entry(path, node), 'line ls');
					print(Object.entries(node).map(([k, v]) => entry(k, v)).join(''), 'line ls');
				},
				cd(path = '~') {
					const [parts, node] = resolve(path);
					if (node === undefined) return print(`cd: no such file or directory: ${esc(path)}`);
					if (typeof node !== 'object') return print(`cd: not a directory: ${esc(path)}`);
					cwd = parts;
				},
				clear() { out.innerHTML = ''; },
				async fastfetch() {
					const info = [
						`<span class="k">julian</span>@<span class="k">ju.lewis</span>`,
						'─'.repeat(15),
						['Name', 'Julian Lewis'],
						['Role', 'Founder, CTO @ Idiom'],
						['Location', 'Melbourne, AU'],
						['Education', 'Computer Science graduate'],
						['Also', 'Motorsports electrical engineer'],
						['Projects', 'Idiom, Lai, PosTrax, MicroQwen'],
						['GitHub', '<a href="https://github.com/ju-lewis" target="_blank" rel="noopener">ju-lewis</a>'],
						['Email', '<a href="mailto:julianlewis2023@gmail.com">julianlewis2023@gmail.com</a>'],
						['Shell', 'jlsh 1.0'],
						'',
						// Tomorrow Night ANSI palette: normal row, then bright row.
						...[['#1d1f21', '#cc6666', '#b5bd68', '#f0c674', '#81a2be', '#b294bb', '#8abeb7', '#c5c8c6'],
							['#666666', '#d54e53', '#b9ca4a', '#e7c547', '#7aa6da', '#c397d8', '#70c0b1', '#eaeaea']]
							.map(row => `<span class="blocks">${row.map(c => `<span style="background:${c}"></span>`).join('')}</span>`),
					];
					const box = print('<img src="imgs/new-car.jpg" alt="Julian Lewis"><div class="info"></div>', 'fastfetch');
					const col = box.querySelector('.info');
					for (const l of info) {
						await sleep(30);
						const d = document.createElement('div');
						d.className = 'line';
						d.innerHTML = Array.isArray(l) ? `<span class="k">${l[0]}</span>: ${l[1]}` : l;
						col.append(d);
						scroll();
					}
				},
			};

			async function run(line) {
				const [cmd, ...args] = line.trim().split(/\s+/);
				if (!cmd) return;
				if (!Object.hasOwn(commands, cmd)) return print(`${esc(cmd)}: command not found. Try 'help'.`);
				await commands[cmd](...args);
			}

			// Type a command into a fake prompt, then run it (intro only).
			async function autoType(cmd) {
				const el = print(`${ps()} <span></span>`);
				const span = el.querySelector('span:last-child');
				await sleep(400);
				for (const c of cmd) { span.textContent += c; await sleep(70); }
				await sleep(250);
				await run(cmd);
			}

			// Bash-style tab completion: commands for the first word, FS paths after.
			function complete() {
				const v = input.value;
				const i = v.lastIndexOf(' ') + 1;
				const word = v.slice(i);
				let base = '', opts;
				if (!v.slice(0, i).trim()) {
					opts = Object.keys(commands).filter(c => c.startsWith(word)).map(c => c + ' ');
				} else {
					base = word.slice(0, word.lastIndexOf('/') + 1);
					const [, node] = resolve(base || '.');
					if (typeof node !== 'object') return;
					opts = Object.entries(node)
						.filter(([k]) => k.startsWith(word.slice(base.length)))
						.map(([k, n]) => base + k + (typeof n === 'object' ? '/' : ' '));
				}
				if (!opts.length) return;
				let common = opts[0];
				for (const o of opts) while (!o.startsWith(common)) common = common.slice(0, -1);
				if (common.length > word.length) {
					input.value = v.slice(0, i) + common;
					return render();
				}
				// Ambiguous: list the options like bash does, keep the line.
				print(`${ps()} ${esc(v)}`);
				print(opts.map(o => `<span>${esc(o.slice(base.length).trim())}</span>`).join(''), 'line ls');
				render();
			}

			function render() {
				const v = input.value, i = input.selectionStart ?? v.length;
				$('ps').innerHTML = ps();
				$('before').textContent = v.slice(0, i);
				$('cur').textContent = v[i] || ' ';
				$('after').textContent = v.slice(i + 1);
				scroll();
			}

			input.addEventListener('input', render);
			input.addEventListener('keyup', render);
			input.addEventListener('keydown', async e => {
				if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
					e.preventDefault();
					hIdx = Math.max(0, Math.min(history.length, hIdx + (e.key === 'ArrowUp' ? -1 : 1)));
					input.value = history[hIdx] ?? '';
					return render();
				}
				if (e.key === 'Tab') { e.preventDefault(); return complete(); }
				if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); return commands.clear(); }
				if (e.key !== 'Enter') return;
				const line = input.value;
				input.value = '';
				print(`${ps()} ${esc(line)}`);
				if (line.trim()) hIdx = history.push(line);
				live.hidden = true;
				await run(line);
				live.hidden = false;
				render();
				input.focus();
			});

			// Click anywhere to focus the prompt, unless selecting text or clicking a link.
			document.addEventListener('click', e => {
				if (!live.hidden && !e.target.closest('a') && !getSelection().toString()) input.focus();
			});

			(async () => {
				await autoType('fastfetch');
				await autoType('help');
				live.hidden = false;
				render();
				input.focus();
			})();
		</script>
	</body>
</html>
